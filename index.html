<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다현이 Word Master AI 10분 완전마스터</title>
<style>
:root {
  --bg:#f5f7fb; --card:#ffffff; --ink:#172033; --muted:#667085; --line:#d9e2f2;
  --primary:#315cff; --primary2:#eaf0ff; --good:#14a36f; --bad:#e24d4d; --warn:#f59e0b;
  --soft:#f8fafc; --shadow:0 12px 30px rgba(20,35,70,.10);
}
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(180deg,#f8fbff,#eef3fb); color:var(--ink); }
.wrap { max-width:1180px; margin:0 auto; padding:16px; }
.header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
.brand { display:flex; align-items:center; gap:12px; }
.robot { width:58px; height:58px; border-radius:20px; background:linear-gradient(145deg,#eaf1ff,#ffffff); display:grid; place-items:center; font-size:34px; box-shadow:var(--shadow); }
h1 { margin:0; font-size:22px; letter-spacing:-.4px; }
.sub { color:var(--muted); font-size:13px; margin-top:3px; }
.timer { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:10px 14px; min-width:145px; text-align:center; }
.timer .time { font-size:22px; font-weight:900; }
.timer .small { font-size:12px; color:var(--muted); }
.grid { display:grid; grid-template-columns:275px 1fr 320px; gap:12px; align-items:start; }
.card { background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:15px; }
.card h2 { margin:0 0 10px; font-size:16px; }
.btn { width:100%; border:0; border-radius:16px; padding:12px 13px; margin:5px 0; cursor:pointer; font-weight:800; background:var(--primary2); color:#1f3fae; }
.btn.primary { background:var(--primary); color:#fff; font-size:16px; }
.btn.good { background:#eafaf3; color:#08764e; }
.btn.warn { background:#fff7e8; color:#9a6200; }
.btn.gray { background:#f1f5f9; color:#334155; }
.btn.red { background:#fff0f0; color:#b42318; }
.btn.inline { width:auto; padding:10px 12px; margin:4px; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.stat { background:var(--soft); border:1px solid var(--line); border-radius:16px; padding:10px; }
.label { color:var(--muted); font-size:12px; }
.num { font-size:23px; font-weight:900; margin-top:3px; }
.progressbar { width:100%; height:10px; background:#e7edf7; border-radius:999px; overflow:hidden; margin:8px 0 2px; }
.progressbar span { display:block; height:100%; width:0%; background:linear-gradient(90deg,#315cff,#14a36f); border-radius:999px; transition:width .3s; }
.mainbox { min-height:555px; display:flex; flex-direction:column; }
.robotmsg { background:var(--primary2); border:1px solid #d5e1ff; border-radius:18px; padding:12px; line-height:1.55; margin-bottom:10px; }
.stage { color:#315cff; font-weight:900; font-size:13px; margin-bottom:6px; }
.word { font-size:44px; line-height:1.05; font-weight:950; letter-spacing:-.7px; margin:8px 0; }
.meaning { font-size:22px; font-weight:850; margin:8px 0 12px; }
.example { background:#f8fafc; border:1px solid var(--line); border-radius:16px; padding:12px; line-height:1.65; margin:10px 0; }
.small { font-size:13px; color:var(--muted); line-height:1.5; }
.pills { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.pill { border:1px solid var(--line); background:#f6f8fc; color:#334155; padding:6px 9px; border-radius:999px; font-size:12px; }
.choices { display:grid; gap:8px; margin:12px 0; }
.choice { width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:16px; padding:13px; font-size:16px; cursor:pointer; }
.choice:hover { border-color:#9db1ff; background:#f8faff; }
.choice.correct { border-color:#14a36f; background:#eafaf3; color:#08764e; }
.choice.wrong { border-color:#e24d4d; background:#fff0f0; color:#b42318; }
.feedback { border-radius:16px; padding:12px; margin:10px 0; line-height:1.55; display:none; }
.feedback.good { display:block; background:#ecfdf3; border:1px solid #bdebd3; color:#086c49; }
.feedback.bad { display:block; background:#fff2f2; border:1px solid #ffd0d0; color:#a73535; }
.inputrow { display:flex; gap:8px; align-items:center; margin:12px 0; }
.inputrow input, select, textarea { width:100%; border:1px solid var(--line); border-radius:14px; padding:12px; font-size:15px; background:#fff; }
textarea { min-height:120px; resize:vertical; font-family:inherit; }
.rightlist { max-height:205px; overflow:auto; padding-right:3px; }
.item { border:1px solid var(--line); background:#f8fafc; border-radius:14px; padding:9px; margin-bottom:8px; }
.item .topline { display:flex; justify-content:space-between; gap:8px; font-weight:800; }
.badge { font-size:11px; padding:4px 7px; border-radius:999px; background:#eaf0ff; color:#2440a8; white-space:nowrap; }
.badge.bad { background:#fff0f0; color:#b42318; }
.badge.good { background:#eafaf3; color:#08764e; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 12px; }
.tab { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 10px; font-size:12px; cursor:pointer; }
.tab.active { background:#172033; color:#fff; border-color:#172033; }
.hidden { display:none; }
.minirow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.footerbtns { margin-top:auto; display:flex; flex-wrap:wrap; gap:8px; }
.footerbtns .btn { flex:1; min-width:130px; }
.copybox { position:fixed; inset:0; background:rgba(10,20,40,.35); display:none; align-items:center; justify-content:center; padding:18px; z-index:50; }
.copybox.show { display:flex; }
.modal { max-width:800px; width:100%; background:#fff; border-radius:24px; padding:18px; box-shadow:0 20px 80px rgba(0,0,0,.25); }
.modal h3 { margin:0 0 10px; }
@media (max-width:980px) { .grid { grid-template-columns:1fr; } .header { align-items:flex-start; } .timer { min-width:120px; } .word { font-size:36px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand"><div class="robot">🤖</div><div><h1>다현이 Word Master AI 10분 완전마스터</h1><div class="sub">DAY 08 · 예문, 파생어, 반의어, 철자까지 10분 압축 반복</div></div></div>
    <div class="timer"><div class="time" id="timer">10:00</div><div class="small" id="timerLabel">대기 중</div></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>오늘 할 일</h2>
      <button class="btn primary" onclick="startMission('ai10')">10분 AI 미션 시작</button>
      <button class="btn good" onclick="startMission('weak5')">틀린 것만 5분 복습</button>
      <button class="btn warn" onclick="makeWeakTxt()">약점 시험지 TXT</button>
      <button class="btn gray" onclick="makeChatGPTPrompt()">ChatGPT 고급훈련 프롬프트</button>
      <button class="btn gray" onclick="toggleCustomBlank()">사용자 괄호 추가</button>
      <button class="btn red" onclick="resetTodayOnly()">오늘 기록 초기화</button>
      <div class="stats">
        <div class="stat"><div class="label">오늘 실력 상승</div><div class="num" id="todayGain">+0</div></div>
        <div class="stat"><div class="label">전체 실력</div><div class="num" id="skillScore">0</div></div>
        <div class="stat"><div class="label">완전마스터</div><div class="num" id="masteredCount">0</div></div>
        <div class="stat"><div class="label">약점 단어</div><div class="num" id="weakCount">0</div></div>
      </div>
      <div class="progressbar"><span id="skillBar"></span></div>
      <div class="small" id="dailySummary">오늘 10분 미션을 시작하세요.</div>
    </div>

    <div class="card mainbox">
      <div class="robotmsg" id="robotMsg">다현 연구원, 오늘은 많이 하지 말고 정확하게 10분만 해요. 앱이 약한 단어를 먼저 골라 줄게요.</div>
      <div id="studyArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="footerbtns">
        <button class="btn gray" onclick="showDashboard()">현황 보기</button>
        <button class="btn gray" onclick="nextTask()">다음 문제</button>
      </div>
    </div>

    <div class="card">
      <h2>AI 반복 처방</h2>
      <div class="tabs">
        <button class="tab active" onclick="setRightTab('weak')" id="tabWeak">약점</button>
        <button class="tab" onclick="setRightTab('growth')" id="tabGrowth">성장</button>
        <button class="tab" onclick="setRightTab('data')" id="tabData">데이터</button>
      </div>
      <div id="rightPanel" class="rightlist"></div>
    </div>
  </div>
</div>

<div class="copybox" id="modalBox">
  <div class="modal">
    <h3 id="modalTitle">자료</h3>
    <textarea id="modalText"></textarea>
    <div class="minirow">
      <button class="btn inline primary" onclick="copyModalText()">복사</button>
      <button class="btn inline gray" onclick="downloadModalText()">TXT 다운로드</button>
      <button class="btn inline red" onclick="closeModal()">닫기</button>
    </div>
    <div class="small" id="modalHint"></div>
  </div>
</div>

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultProgress();

    WORDS.forEach(w => {
      if(!s.words[w.id]) s.words[w.id] = defaultProgress().words[w.id];

}

function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n) { return shuffle(arr).slice(0,n); }
function unique(arr) { return [...new Set(arr.filter(x => x!==undefined && x!==null && String(x).trim()!==''))]; }

function normalize(s) { return String(s||'').trim().toLowerCase().replace(/[.,!?;:]/g,''); }
function todayMs() { return new Date(TODAY).getTime(); }
function dueBonus(p,t) {
  const due = p.type[t]?.due || TODAY;
  return new Date(due).getTime() <= todayMs() ? 2 : 0;
}
function typeWeakness(w,type) {
  const p = getProg(w); const r = p.type[type] || {c:0,w:0,streak:0};
  let missing = 0;
  if(type==='example' && (!w.blanks || w.blanks.length===0)) missing -= 2;
  if(type==='family' && familyList(w).length===0) missing -= 2;
  if(type==='antonym' && antonymList(w).length===0) missing -= 2;
  if(type==='custom' && p.customBlanks.length===0) missing -= 3;
  return r.w*4 - r.c*1.2 - r.streak*2 + missing + dueBonus(p,type);
}
function wordWeakness(w) {
  const p = getProg(w);
  let score = p.wrong*3 - p.correct*.7 + (p.seen===0?4:0) + (p.favorite?2:0);
  ['meaning','koToEn','example','family','spelling','part'].forEach(t => score += Math.max(0,typeWeakness(w,t))*.7);
  if(p.mastered) score -= 8;
  return score;
}
function typeMastered(p,t) { const r=p.type[t]; return r && r.streak>=1 && r.c>=1 && r.w===0 || (r && r.streak>=2); }
function calcWordScore(w) {
  const p=getProg(w); let score=0, total=0;
  const weights={meaning:22,koToEn:16,example:22,family:14,antonym:8,part:8,spelling:10};
  Object.entries(weights).forEach(([t,wt])=>{
    let available = true;
    if(t==='example') available = w.blanks && w.blanks.length>0;
    if(t==='family') available = familyList(w).length>0;
    if(t==='antonym') available = antonymList(w).length>0;
    if(!available) return;
    total += wt;
    const r=p.type[t];
    const raw = Math.min(1, Math.max(0, (r.c*0.55 + r.streak*0.35 - r.w*0.35) / 2));
    score += wt*raw;
  });
  if(total===0) return 0;
  return Math.round(score/total*100);
}
function calcSkill() {
  const avg = WORDS.reduce((s,w)=>s+calcWordScore(w),0)/WORDS.length;
  return Math.round(avg);
}
function updateMastery(w) {
  const score=calcWordScore(w); const p=getProg(w);
  const must = ['meaning','koToEn','example','spelling'];
  const okMust = must.every(t => {
    if(t==='example' && (!w.blanks || w.blanks.length===0)) return true;
    return p.type[t].streak>=1 && p.type[t].c>=1;
  });
  const familyOk = familyList(w).length===0 || p.type.family.streak>=1 || p.type.family.c>=1;
  p.mastered = score>=80 && okMust && familyOk && p.wrong<=Math.max(2,p.correct);
}
function calcDashboard() {
  ensureDaily();
  const skill=calcSkill();
  state.daily[TODAY].skillAfter=skill;
  const mastered=WORDS.filter(w=>getProg(w).mastered).length;
  const weak=WORDS.filter(w=>wordWeakness(w)>5 && !getProg(w).mastered).length;
  const gain = skill - (state.daily[TODAY].skillBefore ?? skill);
  document.getElementById('skillScore').textContent = skill;
  document.getElementById('skillBar').style.width = skill+'%';
  document.getElementById('masteredCount').textContent = mastered + '/' + WORDS.length;
  document.getElementById('weakCount').textContent = weak;
  document.getElementById('todayGain').textContent = (gain>=0?'+':'') + gain;
  const d=state.daily[TODAY];
  document.getElementById('dailySummary').textContent = `오늘 풀이 ${d.attempts}개 · 정답 ${d.correct}개 · 오답 ${d.wrong}개 · 완료 ${d.completed}회`;
  saveState(); renderRightPanel();
}
function familyList(w) { return unique([...(w.derivatives||[]), ...(w.related||[]), ...(w.collocations||[])]); }
function antonymList(w) {
  const all = unique([...(w.antonyms||[])]);
  // 데이터에서 inaccurate처럼 관련어에 들어간 반의어도 잡기
  (w.related||[]).forEach(x => { if(/^in|^un|^dis/.test(x) && x!==w.word) all.push(x); });
  return unique(all);
}
function makeChoices(answer, pool, n=5) {
  let arr = unique([answer, ...sample(pool.filter(x=>normalize(x)!==normalize(answer)), n-1)]);
  while(arr.length<n) arr.push('보기 ' + (arr.length+1));
  return shuffle(arr).slice(0,n);
}
function meaningPool(w) { return WORDS.map(x=>x.meaning).filter(x=>x!==w.meaning); }
function wordPool(w) { return WORDS.map(x=>x.word).filter(x=>x!==w.word); }
function familyPool(w) { return unique(WORDS.flatMap(x=>familyList(x)).filter(x=>!familyList(w).includes(x))); }
function partChoices(ans) { return makeChoices(ans, ['n.','v.','adj.','adv.','prep.','conj.','phr.','v./n.','n./v.','adj./n.'], 5); }
function choiceNo(i) { return ['①','②','③','④','⑤'][i] || (i+1)+'.'; }
function typeAdvice(t) {
  const m={
    meaning:'뜻을 보고 바로 말한 뒤, 5초 후 다시 영어를 가리키세요.',
    koToEn:'한국어 뜻을 보고 영어 단어를 먼저 떠올리는 연습을 2회 하세요.',
    example:'예문을 소리 내어 읽고 괄호 부분만 가려서 3회 반복하세요.',
    family:'파생어와 관련어를 한 가족처럼 묶어서 외우세요.',
    antonym:'반의어는 뜻을 반대로 바꾸는 접두어 in, un, dis를 같이 확인하세요.',
    part:'품사가 바뀌면 문장 자리도 바뀐다는 점을 확인하세요.',
    spelling:'철자를 3번 보고, 2번 가리고, 1번 입력하세요.',
    custom:'직접 만든 괄호는 시험에 가까운 약점이므로 내일 다시 풀어야 합니다.'
  }; return m[t] || '다시 한 번 확인하세요.';
}
function buildTask(w,type) {
  const p=getProg(w);
  if(type==='card') return {wordId:w.id,type,kind:'card',prompt:'단어카드', answer:'알겠어요'};
  if(type==='meaning') return {wordId:w.id,type,kind:'mcq',prompt:`${w.word}의 뜻으로 알맞은 것은?`, choices:makeChoices(w.meaning, meaningPool(w)), answer:w.meaning, explain:`${w.word}는 '${w.meaning}'라는 뜻입니다.`};
  if(type==='koToEn') return {wordId:w.id,type,kind:'mcq',prompt:`'${w.meaning}'에 해당하는 영어 단어는?`, choices:makeChoices(w.word, wordPool(w)), answer:w.word, explain:`'${w.meaning}'에 해당하는 단어는 ${w.word}입니다.`};
  if(type==='example') {
    const b=(w.blanks||[])[0];
    if(!b) return buildTask(w,'meaning');
    const choices = b.choices && b.choices.length>=5 ? shuffle(b.choices).slice(0,5) : makeChoices(b.answer||w.word, wordPool(w).concat(familyPool(w)));
    return {wordId:w.id,type,kind:'mcq',prompt:'다음 예문의 괄호에 알맞은 단어를 고르시오.', sentence:b.display, choices, answer:b.answer||w.word, explain:`예문 속 정답은 ${b.answer||w.word}입니다. 뜻: ${w.meaning}`};
  }
  if(type==='family') {
    const fam=familyList(w); if(fam.length===0) return buildTask(w,'meaning');
    const ans=fam[0];
    return {wordId:w.id,type,kind:'mcq',prompt:`${w.word}의 파생어, 관련어, 표현으로 알맞은 것은?`, choices:makeChoices(ans, familyPool(w)), answer:ans, explain:`${w.word}와 함께 외울 단어/표현: ${fam.join(', ')}`};
  }
  if(type==='antonym') {
    const ants=antonymList(w); if(ants.length===0) return buildTask(w,'family');
    const ans=ants[0];
    return {wordId:w.id,type,kind:'mcq',prompt:`${w.word}의 반의어 또는 반대 의미에 가까운 것은?`, choices:makeChoices(ans, wordPool(w).concat(familyPool(w))), answer:ans, explain:`${w.word}의 반대 의미로 ${ans}를 함께 기억하세요.`};
  }
  if(type==='part') return {wordId:w.id,type,kind:'mcq',prompt:`${w.word}의 품사로 알맞은 것은?`, choices:partChoices(w.part), answer:w.part, explain:`${w.word}의 품사는 ${w.part}입니다.`};
  if(type==='spelling') return {wordId:w.id,type,kind:'input',prompt:`뜻 '${w.meaning}'에 해당하는 영어 단어를 입력하시오.`, answer:w.word, explain:`정답 철자는 ${w.word}입니다.`};
  if(type==='custom') {
    const c=p.customBlanks[0]; if(!c) return buildTask(w,'example');
    return {wordId:w.id,type,kind:'mcq',prompt:'사용자 지정 괄호 문제', sentence:c.display, choices:makeChoices(c.answer, wordPool(w).concat(familyPool(w))), answer:c.answer, explain:`직접 지정한 괄호 정답은 ${c.answer}입니다.`};
  }
  return buildTask(w,'meaning');
}
function pickWords(mode) {
  let candidates=[...WORDS];
  if(mode==='weak5') candidates = WORDS.filter(w=>getProg(w).wrong>0 || wordWeakness(w)>5);
  if(candidates.length===0) candidates=[...WORDS];
  candidates.sort((a,b)=>wordWeakness(b)-wordWeakness(a));
  const newOnes = WORDS.filter(w=>getProg(w).seen===0).slice(0,5);
  const weakOnes = candidates.slice(0,10);
  return unique([...weakOnes, ...newOnes].map(w=>w.id)).map(getWord).filter(Boolean).slice(0,12);
}
function weakestType(w) {
  const types=['meaning','koToEn','example','family','antonym','part','spelling','custom'];
  let best='meaning', score=-999;
  types.forEach(t=>{ const s=typeWeakness(w,t); if(s>score){score=s; best=t;} });
  return best;
}
function buildMission(mode) {
  const selected=pickWords(mode);
  let q=[];
  if(mode==='weak5') {
    selected.slice(0,8).forEach(w=>{ q.push(buildTask(w,weakestType(w))); q.push(buildTask(w,'example')); });
  } else {
    selected.slice(0,5).forEach(w=>q.push(buildTask(w,'card')));
    selected.slice(0,8).forEach(w=>q.push(buildTask(w,'meaning')));
    selected.slice(0,7).forEach(w=>q.push(buildTask(w,'koToEn')));
    selected.slice(0,7).forEach(w=>q.push(buildTask(w,'example')));
    selected.slice(0,5).forEach(w=>q.push(buildTask(w,'family')));
    selected.slice(0,4).forEach(w=>q.push(buildTask(w,'part')));
    selected.slice(0,4).forEach(w=>q.push(buildTask(w,'spelling')));
    // 약점이 큰 단어를 마지막에 한 번 더
    selected.slice(0,5).forEach(w=>q.push(buildTask(w,weakestType(w))));
  }
  return q.filter(Boolean).slice(0, mode==='weak5'?16:45);
}
function startMission(mode) {
  ensureDaily();
  mission = {active:true, mode, queue:buildMission(mode), idx:0, startedAt:Date.now(), beforeSkill:calcSkill()};
  state.daily[TODAY].started += 1;
  state.daily[TODAY].skillBefore = state.daily[TODAY].skillBefore ?? mission.beforeSkill;
  startTimer(mode==='weak5'?5*60:10*60);
  document.getElementById('robotMsg').textContent = mode==='weak5' ? '오답만 압축 복습합니다. 틀린 유형을 바로 다시 만나게 될 거예요.' : '10분 AI 미션을 시작합니다. 새 단어와 약점 단어를 섞어서 최단 경로로 반복합니다.';
  nextTask(true);
}
function startTimer(seconds) {
  if(timerId) clearInterval(timerId);
  let remain=seconds;
  function draw() {
    const m=String(Math.floor(remain/60)).padStart(2,'0'); const s=String(remain%60).padStart(2,'0');
    document.getElementById('timer').textContent=`${m}:${s}`;
    document.getElementById('timerLabel').textContent=mission.active?'미션 진행 중':'대기 중';
  }
  draw();
  timerId=setInterval(()=>{ remain--; if(remain<=0){ remain=0; clearInterval(timerId); finishMission(); } draw(); },1000);
}
function nextTask(fromStart=false) {

}
function renderTask(task) {

    html += `<div class="word">${w.word}</div><div class="meaning">${w.part} · ${w.meaning}</div>`;
    html += `<div class="example"><div>${w.example}</div><div class="small">${w.exampleKo}</div></div>`;

    html += `<div class="minirow"><button class="btn inline good" onclick="selfRate(true)">알겠어요</button><button class="btn inline warn" onclick="selfRate(false)">헷갈려요</button></div>`;

function answerMCQIndex(btn, idx) {
  const selected = currentTask.choices[idx];

}
function selfRate(ok) {
  recordAnswer(ok, ok?'스스로 기억 확인 완료':'헷갈림 표시. 이 단어는 오늘 다시 나옵니다.');
}
function answerMCQ(btn, selected) {
  const buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach(b=>b.disabled=true);
  const ok = normalize(selected)===normalize(currentTask.answer);
  buttons.forEach(b=>{
    const text=b.textContent.replace(/^[①②③④⑤]\s*/, '');
    if(normalize(text)===normalize(currentTask.answer)) b.classList.add('correct');
  });
  if(!ok) btn.classList.add('wrong');
  recordAnswer(ok, makeExplain(selected, ok));
}
function answerInput() {
  const input=document.getElementById('spellInput'); if(!input) return;
  const selected=input.value;
  const ok=normalize(selected)===normalize(currentTask.answer);
  recordAnswer(ok, makeExplain(selected, ok));
}
function makeExplain(selected, ok) {
  const w=getWord(currentTask.wordId);
  let msg = ok ? `정답입니다. ${currentTask.explain||''}` : `오답입니다. 선택/입력: ${selected||'(빈칸)'} · 정답: ${currentTask.answer}. ${currentTask.explain||''}`;
  msg += `<br>반복 처방: ${typeAdvice(currentTask.type)}`;
  return msg;

function recordAnswer(ok, msg) {
  ensureDaily();
  const w=getWord(currentTask.wordId); const p=getProg(w); const t=currentTask.type;
  p.seen += 1;
  p.type[t].last = TODAY;
  if(ok) {
    p.correct += 1; p.type[t].c += 1; p.type[t].streak += 1;
    p.type[t].due = addDays(TODAY, p.type[t].streak>=2 ? 3 : 1);
    state.daily[TODAY].correct += 1; state.daily[TODAY].byType[t].c += 1;
  } else {
    p.wrong += 1; p.type[t].w += 1; p.type[t].streak = 0; p.type[t].due = TODAY;
    p.favorite = true;
    state.daily[TODAY].wrong += 1; state.daily[TODAY].byType[t].w += 1;
    if(mission.active && t!=='card') mission.queue.splice(Math.min(mission.idx+2, mission.queue.length),0, buildTask(w,t));
  }
  state.daily[TODAY].attempts += 1;
  updateMastery(w); saveState(); calcDashboard(); showFeedback(ok,msg);
}
function addDays(dateStr,n) { const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function showFeedback(ok,msg) {

}
function hideFeedback() { const f=document.getElementById('feedback'); f.className='feedback'; f.innerHTML=''; }

function setRightTab(tab) { rightTab=tab; ['Weak','Growth','Data'].forEach(x=>document.getElementById('tab'+x).classList.remove('active')); document.getElementById('tab'+tab[0].toUpperCase()+tab.slice(1)).classList.add('active'); renderRightPanel(); }

function makeWeakTxt() {
  const weak=WORDS.map(w=>({w,score:wordWeakness(w),type:weakestType(w)})).sort((a,b)=>b.score-a.score).slice(0,12);
  const tasks=[];
  weak.forEach(x=>{ tasks.push(buildTask(x.w,x.type)); if(x.type!=='example') tasks.push(buildTask(x.w,'example')); });
  let txt=`Word Master 고등 BASIC DAY 08 약점 시험지
학생: 다현
생성일: ${TODAY}
기준: 오답, 미완성, 예문/파생어/철자 약점 자동 선별

`;
  tasks.slice(0,15).forEach((t,idx)=>{
    const w=getWord(t.wordId);
    txt += `문제 ${idx+1}. ${t.prompt}
`;
    if(t.sentence) txt += `${t.sentence}
`;
    if(t.kind==='input') {
      txt += `정답을 직접 쓰시오.

`;
      txt += `1번 해설 정답 철자는 ${t.answer}이다. ${w.word}는 '${w.meaning}'라는 뜻이다.
`;
      txt += `정답 ${t.answer}

`;
    } else {
      const choices=t.choices || makeChoices(t.answer, wordPool(w));
      choices.slice(0,5).forEach((c,i)=>txt += `${choiceNo(i)} ${c}
`);
      txt += `
`;
      choices.slice(0,5).forEach((c,i)=>{
        const ok=normalize(c)===normalize(t.answer);
        txt += `${i+1}번 해설 ${ok?'정답이다. ':'오답이다. '}${explainChoice(c,t,w)}
`;
      });
      txt += `
정답 ${choiceNo(choices.findIndex(c=>normalize(c)===normalize(t.answer)))}

`;
    }
  });
  showModal('약점 시험지 TXT', txt, 'wordmaster_day08_weak_test.txt', '복사해서 한글이나 Word에 붙여넣으면 바로 시험지로 쓸 수 있습니다.');
}
function explainChoice(c,t,w) {
  if(normalize(c)===normalize(t.answer)) return `${t.explain||''}`;
  const found=WORDS.find(x=>normalize(x.word)===normalize(c));
  if(found) return `${c}는 '${found.meaning}'라는 뜻이므로 이 문항의 정답이 아니다.`;
  return `${c}는 이 문항에서 요구하는 정답 '${t.answer}'와 다르다.`;
}
function makeChatGPTPrompt() {
  const rows=WORDS.map(w=>({w,score:wordWeakness(w),type:weakestType(w),p:getProg(w)})).sort((a,b)=>b.score-a.score).slice(0,10);
  let txt=`다음은 다현이의 Word Master 고등 BASIC DAY 08 약점 데이터입니다.
목표는 하루 10분 안에 단어 뜻, 예문 괄호, 파생어, 반의어, 철자까지 완전마스터하는 것입니다.

요청:
1. 아래 약점 단어만 사용해서 10문제 시험지를 만들어 주세요.
2. 문제 형식은 반드시 '문제 -> 1-5번 보기 -> 1-5번 해설 -> 정답' 순서로 작성해 주세요.
3. 문제 유형은 예문 괄호 4문제, 뜻->영어 2문제, 파생어 2문제, 반의어/품사 1문제, 철자 1문제로 섞어 주세요.
4. 해설은 중1 학생이 바로 이해할 수 있게 짧고 정확하게 써 주세요.
5. 마지막에 '내일 10분 복습 순서'를 5줄로 제시해 주세요.

약점 데이터:
`;
  rows.forEach((x,i)=>{
    const w=x.w; const fam=familyList(w).join(', ') || '없음'; const ant=antonymList(w).join(', ') || '없음';
    txt += `
${i+1}. ${w.word}
품사: ${w.part}
뜻: ${w.meaning}
예문: ${w.example}
해석: ${w.exampleKo}
파생어/관련어: ${fam}
반의어 후보: ${ant}
가장 약한 유형: ${TYPE_LABEL[x.type]}
오답수: ${x.p.wrong}
`;
  });
  showModal('ChatGPT 고급훈련 프롬프트', txt, 'chatgpt_wordmaster_day08_prompt.txt', '이 프롬프트를 복사해서 ChatGPT에 넣으면 다현이 약점 맞춤형 고급 문제가 생성됩니다. GitHub Pages에 API 키를 넣지 않는 안전한 방식입니다.');
}
function toggleCustomBlank() {
  const area=document.getElementById('studyArea');
  const options=WORDS.map(w=>`<option value="${w.id}">${w.order}. ${w.word} - ${w.meaning}</option>`).join('');
  area.innerHTML=`<div class="stage">사용자 지정 괄호 추가</div><div class="robotmsg">예문에서 다현이가 꼭 외워야 할 부분을 직접 괄호로 지정하세요. 예: play an important role 전체를 괄호로 만들 수 있습니다.</div><select id="customWord">${options}</select><textarea id="customSentence" placeholder="문장을 입력하세요. 비워두면 선택 단어의 기본 예문을 사용합니다."></textarea><div class="inputrow"><input id="customTarget" placeholder="괄호로 바꿀 단어 또는 표현"><input id="customAnswer" placeholder="정답. 비워두면 괄호 표현과 같음"></div><button class="btn primary" onclick="saveCustomBlank()">괄호 문제 저장</button>`;
}
function saveCustomBlank() {
  const wid=document.getElementById('customWord').value; const w=getWord(wid); const p=getProg(w);
  let sentence=document.getElementById('customSentence').value.trim() || w.example;
  const target=document.getElementById('customTarget').value.trim(); const answer=document.getElementById('customAnswer').value.trim() || target;
  if(!target) { alert('괄호로 만들 표현을 입력하세요.'); return; }
  const display=sentence.replace(target,'(        )');
  p.customBlanks.unshift({sentence,target,answer,display,created:TODAY}); saveState(); calcDashboard();
  document.getElementById('robotMsg').textContent=`사용자 괄호 저장 완료: ${w.word}`;
  renderTask(buildTask(w,'custom'));
}
function showModal(title, text, filename, hint) {
  modalDownloadName=filename; document.getElementById('modalTitle').textContent=title; document.getElementById('modalText').value=text; document.getElementById('modalHint').textContent=hint||''; document.getElementById('modalBox').classList.add('show');
}
function closeModal() { document.getElementById('modalBox').classList.remove('show'); }
function copyModalText() {
  const text=document.getElementById('modalText').value;
  navigator.clipboard?.writeText(text).then(()=>alert('복사했습니다.')).catch(()=>{document.getElementById('modalText').select(); document.execCommand('copy'); alert('복사했습니다.');});
}
function downloadModalText() {
  const blob=new Blob([document.getElementById('modalText').value],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=modalDownloadName; a.click(); URL.revokeObjectURL(a.href);
}
function resetTodayOnly() {
  if(!confirm('오늘 일일 기록만 초기화할까요? 단어별 누적 진도는 유지됩니다.')) return;
  delete state.daily[TODAY]; saveState(); calcDashboard(); showDashboard();
}
function init() { ensureDaily(); showDashboard(); calcDashboard(); }
init();
</script>
